<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BeltBuster en Google Play</title>
<!-- Short link for TikTok (utm_source=tiktok). ?c=<video id> adds utm_campaign. One anonymous click count
     (network, medium, campaign; no id, no cookie) goes to the game's stats server before Google Play opens. -->
<meta http-equiv="refresh" content="1; url=https://play.google.com/store/apps/details?id=com.erickadriel.beltbusterev&amp;referrer=utm_source%3Dtiktok%26utm_medium%3Dbio">
<script>
(function () {
  var s = "tiktok", m = "bio", c = "";
  try { c = (new URLSearchParams(location.search).get("c") || "").toLowerCase(); } catch (e) {}
  if (!/^[a-z0-9_-]{1,24}$/.test(c)) c = "";
  var ref = "utm_source=" + s + "&utm_medium=" + m + (c ? "&utm_campaign=" + c : "");
  try { navigator.sendBeacon("https://beltbuster-collector.evgames.workers.dev/v1/click", JSON.stringify({s: s, m: m, c: c})); } catch (e) {}
  location.replace("https://play.google.com/store/apps/details?id=com.erickadriel.beltbusterev&referrer=" + encodeURIComponent(ref));
})();
</script>
<style>body{margin:0;background:#06080f;color:#e6edf3;font:16px/1.6 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px;text-align:center}a{color:#38e1ff}</style>
</head>
<body>
<p>Abriendo BeltBuster en Google Play…<br><a href="https://play.google.com/store/apps/details?id=com.erickadriel.beltbusterev&amp;referrer=utm_source%3Dtiktok%26utm_medium%3Dbio">Tocá acá si no se abre</a></p>
</body>
</html>
